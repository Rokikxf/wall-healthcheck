name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Allow unprivileged ICMP (ping sockets)
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Test
        run: pytest
        env:
          # Ping sockets are allowed above: fail rather than skip the ICMP tests.
          WALL_HEALTHCHECK_REQUIRE_ICMP: "1"

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import importlib.metadata as m, tomllib; print(m.version(tomllib.load(open('pyproject.toml', 'rb'))['project']['name']))")
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
